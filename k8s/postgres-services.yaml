apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: agromarket
  labels:
    app.kubernetes.io/name: agromarket
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: agromarket
    app.kubernetes.io/component: database
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agromarket
  labels:
    app.kubernetes.io/name: agromarket
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agromarket
    app.kubernetes.io/component: database
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql

