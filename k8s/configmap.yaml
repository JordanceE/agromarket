apiVersion: v1
kind: ConfigMap
metadata:
  name: agromarket-config
  namespace: agromarket
  labels:
    app.kubernetes.io/name: agromarket
data:
  APP_NAME: AgroMarket
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: http://agromarket.local
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: agromarket
  DB_USERNAME: agromarket
  POSTGRES_DB: agromarket
  POSTGRES_USER: agromarket
  CACHE_STORE: database
  SESSION_DRIVER: database
  QUEUE_CONNECTION: database
  # Backend is a ClusterIP service reached externally through the Ingress controller.
  TRUSTED_PROXIES: "*"
  # Keep disabled in shared/public clusters. Run the seeder once after replacing demo secrets.
  SEED_DATABASE: "false"
